# ============================================================================
# LightNMEA CI: build, tests and example compilation for all platforms
# ============================================================================
# Runs on push to main/master and on pull requests.
#
# Jobs:
#   cmake       - build + unit tests (Linux/macOS/Windows, -Werror)
#   platformio  - firmware compilation (Pico, ESP32) and ESP32 RTOS benchmark
#   arduino     - Arduino sketch compilation (BasicGPS/GPSToJSON/GPSLogger)
#   freertos    - FreeRTOS example and RTOS benchmark build (POSIX port)
#   zephyr      - Zephyr example build (native_sim)
# ============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  cmake:
    name: CMake build & tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxxflags: -Wall -Wextra -Werror
          - os: macos-latest
            cxxflags: -Wall -Wextra -Werror
          - os: windows-latest
            cxxflags: /W4 /WX
    steps:
      - uses: actions/checkout@v4

      # ВАЖНО: флаги передаются через переменную окружения CXXFLAGS
      # (CMake инициализирует CMAKE_CXX_FLAGS из неё при первой конфигурации).
      # Прямая подстановка в командную строку с экранированием "\ " ломает
      # сборку на Windows (PowerShell): MSVC получает "/W4\" -> D8021.
      - name: Configure (warnings as errors)
        run: cmake -S lib/LightNMEA -B build -DCMAKE_BUILD_TYPE=Release
        env:
          CXXFLAGS: ${{ matrix.cxxflags }}

      - name: Build
        run: cmake --build build -j

      # -C Release обязателен для MSVC (multi-config генератор Visual Studio):
      # без него ctest даёт "Test not available without configuration" и
      # все тесты получают статус "Not Run".
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  platformio:
    name: PlatformIO compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: pio-${{ runner.os }}-${{ hashFiles('lib/LightNMEA/benchmarks/firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware benchmark (pico, esp32)
        working-directory: lib/LightNMEA/benchmarks/firmware
        run: pio run -e pico -e esp32

      - name: Build RTOS benchmark (ESP32 D1 mini)
        working-directory: lib/LightNMEA/benchmarks/rtos/esp32
        run: pio run -e d1_mini32

  arduino:
    name: Arduino sketches
    # ВАЖНО: не ubuntu-latest — на Ubuntu 26.04 (миграция ubuntu-latest)
    # экшен compile-sketches падает: его pyproject.toml требует Python
    # 3.12.4, для которой setup-python@v6 нет сборки x64/Ubuntu 26.04
    # ("The version '3.12.4' ... was not found for Ubuntu 26.04").
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # ВАЖНО: arduino-cli требует структуру <ИмяСкетча>/<ИмяСкетча>.ino в
      # корне каталога скетча. Примеры используют PlatformIO-layout
      # (<ИмяСкетча>/src/<ИмяСкетча>.ino), поэтому для CI собираем
      # совместимую структуру во временном каталоге ci-sketches/.
      - name: Prepare sketches (Arduino CLI expects <Sketch>/<Sketch>.ino at sketch root)
        run: |
          for sketch in BasicGPS GPSToJSON GPSLogger; do
            mkdir -p "ci-sketches/$sketch"
            cp "lib/LightNMEA/examples/$sketch/src/$sketch.ino" "ci-sketches/$sketch/"
          done

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          libraries: |
            - source-path: lib/LightNMEA
          sketch-paths: |
            - ci-sketches/BasicGPS
            - ci-sketches/GPSToJSON
            - ci-sketches/GPSLogger
          # нужен verbose, чтобы в лог падали ошибки компиляции
          # (без него видно только "Compilation failed").
          verbose: true

  freertos:
    name: FreeRTOS (host, POSIX port)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build FreeRTOS example
        working-directory: lib/LightNMEA/examples/freertos
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Build FreeRTOS RTOS benchmark
        working-directory: lib/LightNMEA/benchmarks/rtos/freertos
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

  zephyr:
    name: Zephyr (native_sim)
    # ubuntu-24.04 (Python 3.12): Zephyr v3.6.0 может быть несовместим
    # с Python 3.14 из Ubuntu 26.04 (миграция ubuntu-latest).
    runs-on: ubuntu-24.04
    continue-on-error: true  # Zephyr SDK setup may change; do not block CI
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build gperf ccache dfu-util device-tree-compiler wget \
            python3-dev python3-pip python3-setuptools python3-tk python3-wheel xz-utils file make \
            gcc gcc-multilib g++-multilib libsdl2-dev

      - name: Install west
        run: pip3 install west

      - name: Init and update Zephyr workspace
        working-directory: lib/LightNMEA/examples/zephyr
        run: |
          west init -l .
          west update

      # ZEPHYR_TOOLCHAIN_VARIANT=host: в CI нет Zephyr SDK, native_sim
      # (32-bit x86) собирается системным gcc (gcc-multilib установлен выше).
      - name: Build (native_sim)
        working-directory: lib/LightNMEA/examples/zephyr
        run: west build -b native_sim -d build/native_sim -- -DZEPHYR_TOOLCHAIN_VARIANT=host

  quality:
    name: Quality (fuzz + sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run quality checks
        working-directory: lib/LightNMEA
        run: |
          FUZZ_RANDOM=200000 FUZZ_RANDOM_SAN=50000 ./scripts/run_quality_checks.sh