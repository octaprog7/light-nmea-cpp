# ============================================================================
# LightNMEA CodeQL static analysis (GitHub Security)
# ============================================================================
# Analyzes C/C++ code for vulnerabilities and bugs. Runs on push to
# main/master, on pull requests, and on a schedule (weekly).
# ============================================================================

name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"  # every Monday at 03:00 UTC

jobs:
  analyze:
    name: CodeQL analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["cpp"]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Build
        run: |
          cmake -S lib/LightNMEA -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"