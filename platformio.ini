; ============================================================================
; LightNMEA GPS Logger - Multi-Platform Configuration
; ============================================================================
;
; Прошивка: src/main.cpp (кросс-платформенный GPS Logger, платформа
; определяется автоматически). Сборка:
;   pio run -e pico        # Raspberry Pi Pico (RP2040)
;   pio run -e esp32       # ESP32 DevKit
;   pio run -e bluepill    # STM32 Blue Pill
;   pio run -e esp8266     # WEMOS/NodeMCU D1 mini (GPS на Serial)
;   pio run -e feather_m0  # Adafruit Feather M0 (SAMD21)
;   pio run -t upload -e <env>
;   pio device monitor -b 115200
;
; AVR (Uno/Nano) намеренно не включён: дефолтный тулчейн avr-gcc 7.3 не
; поддерживает [[likely]]/[[unlikely]] (нужен GCC >= 9). См. закомментированный
; env:uno в конце файла.
; ============================================================================

; Common settings for all environments
[common]
build_flags = -std=c++17 -O2 -Wall -Wextra -D CORE_DEBUG_LEVEL=3
lib_deps = 

; ============================================================================
; Raspberry Pi Pico (RP2040)
; ============================================================================
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_flags =
    ${common.build_flags}
    -std=gnu++17

; ============================================================================
; ESP32 DevKit (240 MHz, Xtensa LX6, hardware FPU)
; ============================================================================
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11
build_flags =
    ${common.build_flags}
    -std=gnu++17

; ============================================================================
; STM32 Blue Pill (F103C8, Cortex-M3 @ 72 MHz, no FPU)
; ============================================================================
[env:bluepill]
platform = ststm32
board = bluepill_f103c8_128k
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++14
build_flags =
    ${common.build_flags}
    -std=gnu++17

; ============================================================================
; ESP8266 WEMOS/NodeMCU D1 mini (Xtensa L106 @ 80 MHz, no FPU)
; Внимание: на ESP8266 единственный UART (Serial) используется и для GPS,
; и для отладки — см. #warning в src/main.cpp.
; ============================================================================
[env:esp8266]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11
build_flags =
    ${common.build_flags}
    -std=gnu++17

; ============================================================================
; Adafruit Feather M0 (SAMD21, Cortex-M0+ @ 48 MHz, no FPU)
; ============================================================================
[env:feather_m0]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11
    -std=gnu++14
build_flags =
    ${common.build_flags}
    -std=gnu++17

; ============================================================================
; AVR (Arduino Uno/Nano) — НЕ включён: дефолтный тулчейн avr-gcc 7.3 не
; поддерживает [[likely]]/[[unlikely]] (нужен GCC >= 9). Раскомментируйте,
; если ваш тулчейн поддерживает C++17.
; ============================================================================
; [env:uno]
; platform = atmelavr
; board = uno
; framework = arduino
; monitor_speed = 115200
; build_flags =
;     ${common.build_flags}
;     -std=gnu++17
