; ============================================================================
; LightNMEA GPS Logger - Multi-Platform Configuration
; ============================================================================

; Common settings for all environments
[common]
build_flags = -std=c++17 -O2 -Wall -Wextra -D CORE_DEBUG_LEVEL=3
lib_deps = 

; ============================================================================
; Raspberry Pi Pico (RP2040)
; ============================================================================
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_flags = 
    ${common.build_flags}
    -std=gnu++17
