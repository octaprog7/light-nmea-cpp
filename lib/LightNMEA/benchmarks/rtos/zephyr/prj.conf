# LightNMEA Zephyr benchmark - project configuration
#
# C++ поддержка: полная libstdc++ нужна для std::string_view, std::array,
# std::mt19937 (nav_gen.hpp) и C++ runtime (operator delete).

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# nav_gen.hpp использует thread_local (std::mt19937 в get_nav_packet()).
# На ARM (nrf52840) без TLS-поддержки ядра это не линкуется.
CONFIG_THREAD_LOCAL_STORAGE=y

# Основной стек: TinyGPSPlus (~200 Б) + Parser + minmea-структуры + printk.
CONFIG_MAIN_STACK_SIZE=8192