; ============================================================================
; LightNMEA - RTOS (FreeRTOS) comparative benchmark for ESP32 D1 mini
; ============================================================================
;
; Тот же замер, что benchmarks/firmware (Arduino), с использованием
; FreeRTOS: бенчмарк запускается в задаче xTaskCreate, время -
; esp_timer_get_time() (аппаратный таймер). Общее ядро:
; benchmarks/rtos/bench_compare_rtos.hpp.
;
; Build (from this directory):
;   pio run -e d1_mini32
;   pio run -t upload -e d1_mini32
;   pio device monitor -b 115200
;
; Vendored конкуренты (minmea, TinyGPSPlus) используются из
; benchmarks/firmware/lib параметр lib_extra_dirs.

[env:d1_mini32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
; Отменяю дефолтный -std фреймворка (esp32 Arduino: gnu++11), иначе он
; затеняет и ломает C++14 digit separators ("10'000'000" в types.hpp).
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    -Wall
    -Wextra
    ; LightNMEA headers (light_nmea.hpp, types.hpp, nav_gen.hpp, ...)
    -I../../../include
    ; ВАЖНО: НЕ добавляю -I.. (benchmarks/rtos) в глобальный include path -
    ; там лежит Arduino.h-обёртка, которая перекроет настоящий Arduino.h ядра ESP32.
    ; Общее ядро подключается относительным путём из src/main.cpp.
; Vendored конкуренты (minmea, TinyGPSPlus) лежат в ./src (копии из
; benchmarks/firmware/lib, синхронны с benchmarks/compare/third_party):
; PlatformIO компилирует всё из src/, а LDF не прослеживает
; include по относительному пути к общему ядру (../../bench_compare_rtos.hpp).
monitor_speed = 115200