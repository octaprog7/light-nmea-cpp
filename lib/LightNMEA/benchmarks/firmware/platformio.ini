; ============================================================================
; LightNMEA - On-target comparative benchmark firmware (32-bit MCUs)
; ============================================================================
;
; Environments:
;   pico       Raspberry Pi Pico (RP2040, Cortex-M0+ @ 133 MHz)
;   esp32      generic ESP32 dev board (Xtensa LX6 @ 240 MHz)
;   d1_mini32  WEMOS D1 mini ESP32
;   esp32s3    ESP32-S3-DevKitC-1 (Xtensa LX7 @ 240 MHz)
;   esp32c3    ESP32-C3-DevKitM-1 (RISC-V @ 160 MHz)
;   esp8266    WEMOS/NodeMCU D1 mini ESP8266 (Xtensa L106 @ 80 MHz)
;   bluepill   STM32 Blue Pill (F103C8, Cortex-M3 @ 72 MHz)      [not compile-verified]
;   teensy41   Teensy 4.1 (i.MX RT1062, Cortex-M7 @ 600 MHz)    [not compile-verified]
;   feather_m0 Adafruit Feather M0 (SAMD21, Cortex-M0+ @ 48 MHz) [not compile-verified]
;
; Build (from this directory):
;   pio run -e pico        # Raspberry Pi Pico (RP2040)
;   pio run -e esp32       # ESP32 dev board
;   pio run                # all environments
;   pio run -t upload -e pico
;   pio device monitor -b 115200
;
; Or use the wrapper script from benchmarks/:
;   ./build_bench_fw.sh [pico|esp32|d1_mini32|esp32s3|esp32c3|esp8266|bluepill|teensy41|feather_m0|all] [run|upload|monitor|clean]
;
; The firmware compares three NMEA parsers on identical packets from nav_gen.hpp:
;   - LightNMEA   (this library, header-only, integer-only)
;   - minmea      (kosma/minmea, C)
;   - TinyGPSPlus (mikalhart/TinyGPSPlus, Arduino streaming)
; minmea and TinyGPSPlus are vendored copies (src/include layout) in ./lib,
; kept in sync with benchmarks/compare/third_party.

[common]
; Отменяем дефолтный -std фреймворка (esp32 Arduino: gnu++11), иначе он
; перекрывает наш и ломает C++14 digit separators ("10'000'000" в types.hpp).
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    -Wall
    -Wextra
    ; LightNMEA headers (light_nmea.hpp, types.hpp, nav_gen.hpp, ...)
    -I../../include
monitor_speed = 115200

; ----------------------------------------------------------------------------
; Raspberry Pi Pico (RP2040 @ 133 MHz, Cortex-M0+, no FPU)
; ----------------------------------------------------------------------------
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
build_unflags =
    ${common.build_unflags}
build_flags =
    ${common.build_flags}
    ; newlib RP2040 не имеет timegm(); mktime эквивалентен (TZ на плате = UTC).
    -Dtimegm=mktime

; ----------------------------------------------------------------------------
; ESP32 (240 MHz, Xtensa LX6, hardware FPU)
; ----------------------------------------------------------------------------
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
build_unflags =
    ${common.build_unflags}
build_flags =
    ${common.build_flags}

; ----------------------------------------------------------------------------
; WEMOS/LOLIN D1 mini ESP32 (то же железо, что esp32dev: 240 MHz, LX6, FPU;
; отличия — USB-UART CP210x и рекомендуемая скорость загрузки 460800)
; ----------------------------------------------------------------------------
[env:d1_mini32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
build_unflags =
    ${common.build_unflags}
build_flags =
    ${common.build_flags}
upload_speed = 460800
monitor_speed = 115200

; ----------------------------------------------------------------------------
; ESP32-S3 (Xtensa LX7 @ 240 MHz, hardware FPU, USB-OTG)
; ----------------------------------------------------------------------------
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_unflags =
    ${common.build_unflags}
build_flags =
    ${common.build_flags}

; ----------------------------------------------------------------------------
; ESP32-C3 (RISC-V @ 160 MHz, single core, no FPU)
; ----------------------------------------------------------------------------
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_unflags =
    ${common.build_unflags}
build_flags =
    ${common.build_flags}

; ----------------------------------------------------------------------------
; ESP8266 WEMOS/NodeMCU D1 mini (Xtensa L106 @ 80 MHz, no FPU)
; newlib ESP8266 lacks timegm(); mktime эквивалентен (TZ на плате = UTC).
; ----------------------------------------------------------------------------
[env:esp8266]
platform = espressif8266
board = d1_mini
framework = arduino
build_unflags =
    ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -Dtimegm=mktime

; ----------------------------------------------------------------------------
; STM32 "Blue Pill" (F103C8 @ 72 MHz, Cortex-M3, no FPU)
; newlib-nano STM32duino lacks timegm(); mktime эквивалентен (TZ = UTC).
; ----------------------------------------------------------------------------
[env:bluepill]
platform = ststm32
board = bluepill_f103c8_128k
framework = arduino
; GCC 9.2 (arm-none-eabi) уже установлен глобально; [[likely]] поддерживается
; начиная с GCC 9, поэтому отдельная загрузка тулчейна 12.3 не требуется.
platform_packages =
    platformio/toolchain-gccarmnoneeabi@1.90201.191206
build_unflags =
    ${common.build_unflags}
    -std=gnu++14
build_flags =
    ${common.build_flags}
    -Dtimegm=mktime

; ----------------------------------------------------------------------------
; Teensy 4.1 (i.MX RT1062 @ 600 MHz, Cortex-M7, hardware FPU)
; ----------------------------------------------------------------------------
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_unflags =
    ${common.build_unflags}
    -std=gnu++14
build_flags =
    ${common.build_flags}
    -Dtimegm=mktime

; ----------------------------------------------------------------------------
; Adafruit Feather M0 (SAMD21 @ 48 MHz, Cortex-M0+, no FPU)
; ----------------------------------------------------------------------------
[env:feather_m0]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
build_unflags =
    ${common.build_unflags}
    -std=gnu++11
    -std=gnu++14
build_flags =
    ${common.build_flags}
    -Dtimegm=mktime
