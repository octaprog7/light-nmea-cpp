; ============================================================================
; LightNMEA ESP32-C3 + MAX7219 example - PlatformIO configuration
; ============================================================================
;
; /!\ /!\ /!\ ВАЖНО: параметры внешней флэш-памяти (flash_mode / flash_freq /
; /!\ /!\ /!\ flash_size) НЕ УДАЛЯТЬ и НЕ МЕНЯТЬ!
;
; Плата LuatOS CORE-ESP32-C3 не имеет встроенной flash: чип ESP32-C3 работает
; с ВНЕШНЕЙ SPI-flash 4MB (линии на GPIO11..17). Загрузчик стартует только если
; параметры шины в заголовке образа СОВПАДАЮТ с реальным железом. Дефолтный
; профиль esp32-c3-devkitm-1 (QIO) с этой платой несовместим: плата выглядит
; полностью мёртвой — ни логов, ни реакции на reset, при исправном железе.
;
; Лечение, если плата уже «ослепла»:
;   1) Вернуть эти три строки в [env:esp32c3].
;   2) esptool.py --port <порт> --chip esp32c3 erase_flash   (обязательно!)
;   3) pio run -t upload -e esp32c3                          (чистая заливка)
;
; Аналогично для ЛЮБОЙ другой платы с внешней SPI-flash: сначала сверьте
; flash_mode/flash_freq/flash_size с даташитом платы — это причина N1
; «неработающих» прошивок на ESP32-C3/S3.
; ----------------------------------------------------------------------------
; C++ пример работы с 8-ми символьным семисегментным индикатором на основе MAX7219,
; подключённым, через преобразователь уровней.
; Распиновка:
;   SPI1: SCK = GPIO4, MOSI = GPIO6, MISO = GPIO5 (не используется)
;   CS  = GPIO7 (активный LOW)
;
; Сборка из этого каталога:
;   pio run -e esp32c3
;   pio run -t upload -e esp32c3
;   pio device monitor -b 115200
;; ============================================================================

[common]
lib_deps = LightNMEA=symlink://../..
build_flags =
    -std=gnu++17
    -O2
monitor_speed = 115200

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
; Плата LuatOS CORE-ESP32-C3 с внешней SPI-flash: консервативные параметры шины
board_build.flash_mode = dio
board_build.flash_freq = 40m
board_build.flash_size = 4MB
build_unflags =
    -std=gnu++11
lib_deps =
    ${common.lib_deps}
build_flags =
    ${common.build_flags}
