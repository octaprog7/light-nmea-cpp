; ============================================================================
; LightNMEA Pico example - PlatformIO configuration
; ============================================================================
; Raspberry Pi Pico (RP2040, Cortex-M0+ @ 133 MHz) + GNSS-модуль G10F-F30
; на GP0/GP1 (UART0).
;
; Сборка из этого каталога:
;   pio run -e pico                 # собрать (реальный режим: GNSS на UART0)
;   pio run -e pico -t upload       # прошить (picotool сам уводит плату в BOOTSEL)
;   pio device monitor              # вывод по USB CDC (GNSS занимает UART0)
;
; Демо-режим (без GNSS-модуля и спутников, для проверки в помещении):
;   pio run -e pico_demo -t upload
;
; Библиотека LightNMEA (lib/LightNMEA) подключается lib_deps с 'symlink://../..'.
; ============================================================================

[common]
lib_deps = LightNMEA=symlink://../..
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    -Wall
    -Wextra
    ; Скорость UART GNSS-модуля (G10F-F30 по умолчанию 38400 бод)
    -DGNSS_BAUD=38400
    ; Пины GNSS: GP0 (UART0 TX -> RX модуля), GP1 (UART0 RX <- TX модуля)
    -DGNSS_TX_PIN=0
    -DGNSS_RX_PIN=1
monitor_speed = 115200

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
; Прошивка через picotool: плату не надо вручную уводить в BOOTSEL
upload_protocol = picotool
lib_deps =
    ${common.lib_deps}
build_unflags =
    ${common.build_unflags}
build_flags =
    ${common.build_flags}

; ----------------------------------------------------------------------------
; Демо-режим: встроенный синтетический NMEA-трек вместо UART.
; Для проверки конвейера в помещении (GNSS-модуль не нужен и не используется).
; ----------------------------------------------------------------------------
[env:pico_demo]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
upload_protocol = picotool
lib_deps =
    ${common.lib_deps}
build_unflags =
    ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -DLIGHTNMEA_DEMO
