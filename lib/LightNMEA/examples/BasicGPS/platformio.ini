; ============================================================================
; LightNMEA BasicGPS example - PlatformIO configuration
; ============================================================================
; Сборка из этого каталога:
;   pio run -e pico        # Raspberry Pi Pico (RP2040)
;   pio run -e esp32dev    # ESP32 DevKit
;   pio run -e esp32c3     # ESP32-C3 DevKitM-1
;   pio run -e esp32s3     # ESP32-S3-DevKitC-1
;   pio run -e esp8266     # WEMOS/NodeMCU D1 mini (ESP8266)
;   pio run -e bluepill    # STM32 Blue Pill
;   pio run -t upload -e <env>
;   pio device monitor -b 115200
;
; Библиотека LightNMEA (lib/LightNMEA) подключается lib_deps
; с 'symlink://../..'' - стандартный способ для локальных
; библиотек в PlatformIO 6.x (lib_extra_dirs устарел с версии 6.0).
; Скетч лежит в src/ (src_dir по умолчанию).
; ============================================================================

[common]
lib_deps = LightNMEA=symlink://../..
build_flags =
    -std=gnu++17
    -O2
monitor_speed = 115200

; ----------------------------------------------------------------------------
; Raspberry Pi Pico (RP2040, Cortex-M0+ @ 133 MHz)
; ----------------------------------------------------------------------------
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
lib_deps =
    ${common.lib_deps}
build_flags =
    ${common.build_flags}

; ----------------------------------------------------------------------------
; ESP32 DevKit (Xtensa LX6 @ 240 MHz, hardware FPU)
; ----------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_unflags =
    -std=gnu++11
lib_deps =
    ${common.lib_deps}
build_flags =
    ${common.build_flags}

; ----------------------------------------------------------------------------
; ESP32-C3 (RISC-V @ 160 MHz, single core, no FPU)
; ----------------------------------------------------------------------------
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_unflags =
    -std=gnu++11
lib_deps =
    ${common.lib_deps}
build_flags =
    ${common.build_flags}

; ----------------------------------------------------------------------------
; ESP32-S3 (Xtensa LX7 @ 240 MHz, hardware FPU, USB-OTG)
; ----------------------------------------------------------------------------
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_unflags =
    -std=gnu++11
lib_deps =
    ${common.lib_deps}
build_flags =
    ${common.build_flags}

; ----------------------------------------------------------------------------
; ESP8266 WEMOS/NodeMCU D1 mini (Xtensa L106 @ 80 MHz, no FPU)
; newlib ESP8266 lacks timegm(); mktime эквивалентен (TZ на плате = UTC).
; ----------------------------------------------------------------------------
[env:esp8266]
platform = espressif8266
board = d1_mini
framework = arduino
build_unflags =
    -std=gnu++11
lib_deps =
    ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -Dtimegm=mktime

; ----------------------------------------------------------------------------
; STM32 Blue Pill (F103C8, Cortex-M3 @ 72 MHz, no FPU)
; ----------------------------------------------------------------------------
[env:bluepill]
platform = ststm32
board = bluepill_f103c8_128k
framework = arduino
build_unflags =
    -std=gnu++14
lib_deps =
    ${common.lib_deps}
build_flags =
    ${common.build_flags}