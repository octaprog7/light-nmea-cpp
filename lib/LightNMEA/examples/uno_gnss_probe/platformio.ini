; ============================================================================
; uno_gnss_probe - диагностика обмена с GNSS (Arduino UNO R3)
; ============================================================================
;
; Подключение (напрямую к UNO или через 3-контактные колодки шилда):
;   GNSS TX  (синий)   -> D5  (SoftwareSerial RX)
;   GNSS RX  (зелёный) -> D6  (SoftwareSerial TX)
;   GNSS VCC (красный) -> 5V
;   GNSS GND (чёрный)  -> GND
;
; Прошивка печатает сырые NMEA-строки и опрашивает модуль по UBX:
;   - UBX-MON-VER  - версия ПО/железа модуля;
;   - UBX-CFG-PRT  - конфигурация порта (скорость, протоколы).
; Ответы печатаются в hex с расшифровкой. Фикс для проверки не нужен.
;
; Сборка и прошивка из этого каталога:
;   pio run -e uno
;   pio run -e uno -t upload --upload-port /dev/ttyUSB0
;   pio device monitor -b 115200
; ============================================================================

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    -Wall
    -Wextra
    ; Буфер приёма SoftwareSerial. По умолчанию 64 байта - этого мало для
    ; ответа UBX-MON-VER (160 байт payload), пока печатается NMEA.
    -D_SS_MAX_RX_BUFF=256
