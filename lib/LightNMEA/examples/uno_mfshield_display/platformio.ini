; ============================================================================
; MFShieldDisplay test - Arduino UNO R3 + Multi-Function Shield
; ============================================================================
;
; Отдельное проверочное приложение для драйвера 4-разрядного
; семисегментного индикатора шилда (2 x 74HC595):
;     LATCH = D4, CLOCK = D7, DATA = D8
;
; Драйвер берётся из локальной библиотеки lib/MFShieldDisplay.
;
; Сборка и прошивка из этого каталога:
;   pio run -e uno
;   pio run -e uno -t upload
;   pio device monitor -b 115200
; ============================================================================

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    -Wall
    -Wextra
lib_deps =
    MFShieldDisplay=symlink://../../../MFShieldDisplay
