# ============================================================================
# LightNMEA Zephyr example - west manifest
# ============================================================================
# Defines the Zephyr version used to build the example:
#   west init -l .
#   west update
#   west build -b native_sim -d build/native_sim
# ============================================================================

manifest:
  # ВАЖНО: поле remote проекта — это ИМЯ remote из секции remotes,
  # а не URL. Прямой URL в remote даёт
  # "Malformed manifest file: project zephyr remote <url> is not defined".
  remotes:
    - name: zephyrproject
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      remote: zephyrproject
      revision: v3.6.0
      import: true
  self:
    path: .