# LightNMEA Zephyr example - project configuration
#
# uart_pipe: простой API для приёма потока данных из UART в обработчик.
# Устройство выбирается с помощью devicetree chosen "zephyr, uart-pipe"
# (см. boards/*.overlay).
#
# ВАЖНО: CONFIG_UART_PIPE включается НЕ здесь, а в per-board конфигах
# boards/<board>.conf (см. boards/nrf52840dk_nrf52840.conf). Причина:
# в Zephyr v3.6.0 в native_sim нет serial-драйвера, выставляющего
# SERIAL_SUPPORT_INTERRUPT, поэтому CONFIG_UART_PIPE (select
# UART_INTERRUPT_DRIVEN) роняет Kconfig ("Aborting due to Kconfig
# warnings"), а CONFIG_SERIAL без драйвера бесполезен. На платах с
# рабочим UART-драйвером (nrf52840dk и др.) uart_pipe включён и пример
# принимает NMEA-поток через boards/<board>.conf.

# Поддержка для std::string_view (substr) C++ нужна полная libstdc++ и C++ runtime (operator delete).
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
