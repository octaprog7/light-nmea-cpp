# LightNMEA Zephyr example - project configuration
#
# uart_pipe: простой API для приёма потока данных из UART в обработчик.
# Устройство выбирается с помощью devicetree chosen "zephyr, uart-pipe"
# (см. boards/*.overlay).

# ВАЖНО: CONFIG_UART_PIPE находится внутри блока "if SERIAL" в
# drivers/serial/Kconfig. В defconfig native_sim CONFIG_SERIAL не включён,
# поэтому UART_PIPE молча игнорируется и линковка падает с
# "undefined reference to uart_pipe_register".
CONFIG_SERIAL=y

CONFIG_UART_PIPE=y

# UART0 native_sim: подключение к stdin/stdout вызывающего терминала
# (соответствует комментарию в boards/native_sim.overlay; по умолчанию
# UART0 подключается к отдельному pty).
CONFIG_NATIVE_UART_0_ON_STDINOUT=y

# Поддержка для std::string_view (substr) C++ нужна полная libstdc++ и C++ runtime (operator delete).
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
