# nrf52840dk: включаем uart_pipe (приём NMEA через UART).
# На этой плате драйвер nrfx UART выставляет SERIAL_SUPPORT_INTERRUPT,
# поэтому select-цепочка UART_PIPE -> UART_INTERRUPT_DRIVEN разрешается
# корректно (на native_sim в Zephyr 3.6 это не так — там uart_pipe не
# включается, см. комментарий в prj.conf).
CONFIG_SERIAL=y
CONFIG_UART_PIPE=y
