; ============================================================================
; LightNMEA GPSLogger example - PlatformIO configuration
; ============================================================================
; Сборка из этого каталога:
;   pio run -e pico        # Raspberry Pi Pico (RP2040)
;   pio run -e esp32dev    # ESP32 DevKit
;   pio run -e bluepill    # STM32 Blue Pill
;   pio run -t upload -e <env>
;   pio device monitor -b 115200
;
; lib_extra_dirs = ../..  ->  библиотека LightNMEA (lib/LightNMEA) лежит
; двумя уровнями выше и подхватывается автоматически.
;
; Примечание: для записи на SD-карту укажите правильный chipSelect
; для вашей платы (см. GPSLogger.ino).
; ============================================================================

[common]
lib_extra_dirs = ../..
build_flags =
    -std=gnu++17
    -O2
monitor_speed = 115200

; ----------------------------------------------------------------------------
; Raspberry Pi Pico (RP2040, Cortex-M0+ @ 133 MHz)
; ----------------------------------------------------------------------------
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
build_flags =
    ${common.build_flags}

; ----------------------------------------------------------------------------
; ESP32 DevKit (Xtensa LX6 @ 240 MHz, hardware FPU)
; ----------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_unflags =
    -std=gnu++11
build_flags =
    ${common.build_flags}

; ----------------------------------------------------------------------------
; STM32 Blue Pill (F103C8, Cortex-M3 @ 72 MHz, no FPU)
; ----------------------------------------------------------------------------
[env:bluepill]
platform = ststm32
board = bluepill_f103c8_128k
framework = arduino
build_unflags =
    -std=gnu++14
build_flags =
    ${common.build_flags}